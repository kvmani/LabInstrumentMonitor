# Approved intranet HTTPS front end. Replace the hostname and certificate paths with the
# site-issued ones. The API listens on 127.0.0.1:8000 only.
server {
    listen 443 ssl;
    server_name monitor.lab.example;

    ssl_certificate     /etc/labmon/tls/fullchain.pem;
    ssl_certificate_key /etc/labmon/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;          # ingest batches are capped at 1 MiB
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }
}

server {
    listen 80;
    server_name monitor.lab.example;
    return 301 https://$host$request_uri;
}
